<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sites para Arquitetos · Showcase</title>
<link rel="icon" type="image/png" href="../assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Archivo:wght@300;400;500;600;700;800;900&family=Archivo+Black&family=DM+Serif+Display&family=JetBrains+Mono:wght@300;400;500;600&family=PT+Serif:wght@400;700&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #0d0d0c;
    color: #eae6df;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  /* Scoped reset for previews so sites render isolated */
  .preview-frame * { box-sizing: border-box; }
  /* Floating WhatsApp button shared */
  .wa-float {
    position: fixed; bottom: 24px; right: 24px;
    background: #25d366; color: #fff;
    padding: 14px 20px; border-radius: 999px;
    font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 14px;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 30px rgba(37,211,102,.35), 0 2px 8px rgba(0,0,0,.2);
    z-index: 9999;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .wa-float:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(37,211,102,.45); }
  .wa-float svg { width: 20px; height: 20px; }
  .mobile-site-menu { display: none; }
  /* Selection */
  ::selection { background: #eae6df; color: #0d0d0c; }

  @media (max-width: 860px) {
    html, body, #root, .preview-frame { width: 100%; max-width: 100%; overflow-x: hidden; }
    .desktop-menu { display: none !important; }
    .mobile-site-menu {
      display: block;
      position: fixed !important;
      top: 86px;
      right: 22px;
      z-index: 10050;
      font-family: 'Manrope', system-ui, sans-serif;
    }
    .mobile-site-menu summary {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: rgba(17,17,15,.92);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 12px 32px rgba(0,0,0,.22);
      display: grid;
      place-content: center;
      gap: 5px;
      list-style: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-site-menu summary::-webkit-details-marker { display: none; }
    .mobile-site-menu summary span {
      width: 19px;
      height: 2px;
      border-radius: 999px;
      background: #fff;
      display: block;
    }
    .mobile-site-menu nav {
      position: fixed;
      top: 140px;
      right: 22px;
      min-width: 210px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(17,17,15,.96);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 20px 48px rgba(0,0,0,.28);
      display: grid;
      gap: 2px;
    }
    .mobile-site-menu nav a {
      color: #f7f3ee;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 13px;
      border-radius: 10px;
    }
    .mobile-site-menu nav a:hover { background: rgba(255,255,255,.08); }
    .preview-frame [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    .preview-frame [style*="display: flex"] { flex-wrap: wrap !important; }
    .preview-frame [style*="padding: 120px"],
    .preview-frame [style*="padding: 100px"],
    .preview-frame [style*="padding: 90px"],
    .preview-frame [style*="padding: 80px"],
    .preview-frame [style*="padding: 74px"],
    .preview-frame [style*="padding: 72px"],
    .preview-frame [style*="padding: 70px"],
    .preview-frame [style*="padding: 64px"],
    .preview-frame [style*="padding: 60px"] { padding: 48px 20px !important; }
    .preview-frame [style*="gap: 80px"],
    .preview-frame [style*="gap: 70px"],
    .preview-frame [style*="gap: 60px"],
    .preview-frame [style*="gap: 56px"],
    .preview-frame [style*="gap: 54px"],
    .preview-frame [style*="gap: 50px"],
    .preview-frame [style*="gap: 40px"] { gap: 24px !important; }
    .preview-frame [style*="minmax(360px"],
    .preview-frame [style*="minmax(320px"] { grid-template-columns: 1fr !important; }
    .preview-frame img { max-width: 100%; height: auto; }
    .preview-frame [style*="width: 100vw"] { width: 100% !important; }
    .preview-frame [style*="font-size: 32px"] { font-size: 24px !important; }
    .wa-float {
      left: 14px; right: 14px; bottom: 14px;
      justify-content: center; padding: 13px 16px; font-size: 13px;
    }
  }

  @media (max-width: 560px) {
    .preview-frame [style*="font-size: clamp(72px"],
    .preview-frame [style*="font-size: clamp(64px"],
    .preview-frame [style*="font-size: clamp(56px"],
    .preview-frame [style*="font-size: clamp(52px"],
    .preview-frame [style*="font-size: clamp(48px"] {
      font-size: clamp(36px, 13vw, 58px) !important;
      line-height: 1.02 !important;
    }
    .preview-frame [style*="height: 640px"],
    .preview-frame [style*="height: 620px"],
    .preview-frame [style*="height: 560px"],
    .preview-frame [style*="min-height: 620px"] {
      height: auto !important;
      min-height: 520px !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="models/forma.jsx"></script>

<script type="text/babel" src="models/premium.jsx"></script>

</body>
</html>
