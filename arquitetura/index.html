<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sites para Arquitetos · Showcase</title>
<link rel="icon" type="image/png" href="../assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Archivo:wght@300;400;500;600;700;800;900&family=Archivo+Black&family=DM+Serif+Display&family=JetBrains+Mono:wght@300;400;500;600&family=PT+Serif:wght@400;700&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #0d0d0c;
    color: #eae6df;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  /* Scoped reset for previews so sites render isolated */
  .preview-frame * { box-sizing: border-box; }
  /* Floating WhatsApp button shared */
  .wa-float {
    position: fixed; bottom: 24px; right: 24px;
    background: #25d366; color: #fff;
    padding: 14px 20px; border-radius: 999px;
    font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 14px;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 30px rgba(37,211,102,.35), 0 2px 8px rgba(0,0,0,.2);
    z-index: 9999;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .wa-float:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(37,211,102,.45); }
  .wa-float svg { width: 20px; height: 20px; }
  /* Selection */
  ::selection { background: #eae6df; color: #0d0d0c; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
